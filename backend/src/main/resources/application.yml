spring:
  application: { name: multi-vendor-ecommerce }
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    # NOTE: open-in-view is intentionally enabled here. CartController and
    # OrderController return raw entities (Cart, Order) with LAZY
    # associations (Cart.user, Order.user, Product.seller, Product.category)
    # from plain (non-@Transactional) methods. With OSIV disabled, Jackson
    # hits those lazy proxies during response serialization -- after the
    # Hibernate session has already closed -- and every GET /cart,
    # POST /cart/items and GET /orders call throws LazyInitializationException.
    # The correct long-term fix is to have those endpoints return DTOs (the
    # way ProductController already does via its `view()` helper) instead of
    # entities; enabling OSIV is the minimal fix that unblocks them without
    # restructuring those controllers.
    open-in-view: true
    hibernate: { ddl-auto: validate }
    properties.hibernate.jdbc.time_zone: UTC
  flyway: { enabled: true, locations: classpath:db/migration }
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer.properties.[spring.json.add.type.headers]: false
    consumer.group-id: ecommerce
    consumer.auto-offset-reset: earliest
server.port: ${SERVER_PORT:8080}
management.endpoints.web.exposure.include: health,info,metrics,prometheus
management.endpoint.health.show-details: always
springdoc.swagger-ui.path: /swagger-ui.html
app.jwt.secret: ${JWT_SECRET:change-this-secret-to-at-least-32-characters-long}
app.jwt.expiration-ms: ${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
app.cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
logging.level.com.ecommerce: INFO
